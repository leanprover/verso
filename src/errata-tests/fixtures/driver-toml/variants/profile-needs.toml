# Only the `stamped` profile's settings refer to the needs, and a shell script is a test executable
# of its own, which prints the directory of Errata's sources that the runner gives it.
[profile.stamped.settings]
"TomlLib.stampFile" = { needs = "stamp" }
"TomlLib.markerFile" = { needs = "marker" }

[needs]
stamp = "stamp"
marker = "marker"

[[executable]]
name = "extra"
command = ["bash", "-c", '''
if [ "$1" = errata-list ]; then
  printf '%s\n' '{"type":"protocol","version":1}' '{"type":"test","name":"where"}' >> "$2"
else
  echo "errata-dir=$ERRATA_DIR"
fi
''', "extra"]
