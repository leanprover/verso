# The configuration of Verso's tests, which `lake test` reads. The runner's profiles are named
# kinds of run: `default` for a developer's machine, `browser` for the browser tests alone, and `ci`
# for continuous integration. Settings of Lean tests are named by their fully qualified declaration
# names; the settings of `VersoTests.Settings` are given in a table of their namespace.

# A plain `lake test` leaves out the browser tests, which need built sites and browsers.
[profile.default]
default-filter = 'all() \ tag(browser)'

[profile.default.settings]
versoServeExe = { needs = "verso-serve" }

[profile.default.settings.VersoTests.Settings]
checkTeX = "false"
versoExe = { needs = "verso" }
literateHtmlExe = { needs = "verso-literate-html" }
literatePlanExe = { needs = "verso-literate-plan" }

# A test of Errata's conformance suite needs a value that nothing else gives.
[profile.default.settings.ErrataTests.Roles]
required = "given"

# The browser tests alone, each suite with the site it tests. Lake builds the sites of the user's
# guide and the package documentation example; the literate suites build theirs as they run.
[profile.browser]
default-filter = "tag(browser)"

[[profile.browser.override]]
filter = "exe(browser-search)"
settings.siteDir = { needs = "usersGuideSite" }

[[profile.browser.override]]
filter = "exe(browser-package-manual)"
settings.siteDir = { needs = "packageManualSite" }

# Continuous integration runs every test, with the browser tests' sites. Linux headless Firefox
# disables the CSS guarded by `@media (hover: hover)`, so the tests that need it run on Chromium.
[profile.ci]
inherits = "browser"
default-filter = 'all() \ (tag(hover_media) & name(firefox))'
junit = "errata-report.xml"
markdown = "errata-summary.md"

[profile.ci.settings.VersoTests.Settings]
checkTeX = "true"

[[profile.ci.override]]
filter = "tag(browser) | tag(slow)"
timeout = "30m"

# Verso's language server tests, one test per case.
[[executable]]
name = "interactive"
command = ["bash", "src/tests/interactive/tests.sh"]

# The development server's test.
[[executable]]
name = "serve"
command = ["bash", "src/tests/run_serve_test.sh"]

# The browser suites, each through Verso's pytest harness.
[[executable]]
name = "browser-search"
command = ["uv", "run", "--project", "browser-tests", "--extra", "test", "python",
  "browser-tests/errata_pytest.py",
  "browser-tests/test_search.py", "browser-tests/test_search_priority.py",
  "browser-tests/test_search_page.py", "browser-tests/test_search_path_prefix.py",
  "browser-tests/test_toc_resize.py", "browser-tests/test_redirect.py", "browser-tests/test_katex.py"]

[[executable]]
name = "browser-literate"
command = ["bash", "browser-tests/errata_with_site.sh", "literate", "test-projects/literate-config",
  "browser-tests/literate"]

[[executable]]
name = "browser-literate-multi-root"
command = ["bash", "browser-tests/errata_with_site.sh", "literate",
  "test-projects/literate-multi-root", "browser-tests/literate-multi-root"]

[[executable]]
name = "browser-verso-html"
command = ["bash", "browser-tests/errata_with_site.sh", "verso-html",
  "test-projects/literate-config", "+LitConfig:literate", "browser-tests/verso-html"]

[[executable]]
name = "browser-package-manual"
command = ["uv", "run", "--project", "browser-tests", "--extra", "test", "python",
  "browser-tests/errata_pytest.py", "browser-tests/package-manual"]

[[executable]]
name = "browser-errata-widget"
command = ["uv", "run", "--project", "browser-tests", "--extra", "test", "python",
  "browser-tests/errata_pytest.py", "browser-tests/errata-widget", "-m", "errata_widget"]
