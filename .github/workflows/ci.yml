on:
    push:
        branches:
            - master
            - main
            - "bump/**"
    pull_request:
    merge_group:

name: Continuous Integration

jobs:
    build:
        name: Build and test
        runs-on: nscloud-ubuntu-22.04-amd64-8x16
        permissions:
            contents: write
            checks: write
        env:
            # Used for browser tests. Placing them here allows caching to work right.
            PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
        steps:
            - name: install elan
              run: |
                  set -o pipefail
                  curl -sSfL https://github.com/leanprover/elan/releases/download/v3.0.0/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
                  ./elan-init -y --default-toolchain none
                  echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

            - uses: actions/checkout@v7.0.1
              with:
                  # Two commits, so that the release note check below resolves HEAD^1 and passes
                  # it to the script as RELEASE_NOTES_BASE.
                  fetch-depth: 2

            - name: List all files
              run: |
                  find . -name "*.lean" -type f

            # The installs and cache restores that are marked `background` run while the
            # toolchains install and the project builds. A `wait` step that names a background
            # step blocks until it finishes, fails if it failed, and makes its changes to the
            # PATH visible to the steps that follow.
            - name: Install PDF Dependencies
              id: texlive
              uses: $/.github/actions/install-texlive
              background: true

            # Inkscape is needed by the LaTeX `svg` package, which converts
            # SVG files emitted by `diagram` code blocks to PDF at build time.
            - name: Install Inkscape
              id: inkscape
              run: sudo apt-get update && sudo apt-get install -y --no-install-recommends inkscape
              background: true

            - name: Install uv
              id: uv
              uses: astral-sh/setup-uv@v10.3.3
              with:
                  enable-cache: true
                  cache-dependency-glob: "browser-tests/pyproject.toml"
              background: true

            - name: Cache Playwright browsers
              id: playwright-cache
              uses: actions/cache@v6.1.0
              with:
                  path: .playwright-browsers
                  key: playwright-${{ runner.os }}-${{ hashFiles('browser-tests/uv.lock') }}
              background: true

            - uses: actions/setup-node@v7.1.0
              id: node
              with:
                  node-version: "lts/*"
                  cache: npm
              background: true

            - name: Install linkchecker
              id: linkchecker
              run: pip install linkchecker
              background: true

            - name: Compute short SHA
              id: shortSHA
              run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

            - name: Cache .lake
              id: lake-cache
              uses: actions/cache@v6.1.0
              with:
                  path: .lake
                  # The SHA is in the key to get the most recent cache possible, rather than just saving a single one for each Lean/deps version and not touching it.
                  key:
                      ${{ runner.os }}-${{ hashFiles('lake-manifest.json') }}-${{
                      hashFiles('lean-toolchain') }}-${{ steps.shortSHA.outputs.short_sha }}
                  # Try to restore cache for same OS/Lean/deps, but don't get less specific, because Lake isn't always happy to get build product version mismatches
                  restore-keys: |
                      ${{ runner.os }}-${{ hashFiles('lake-manifest.json') }}-${{ hashFiles('lean-toolchain') }}-
              background: true

            - name: Cache literate-config test project
              id: literate-config-cache
              uses: actions/cache@v6.1.0
              with:
                  path: test-projects/literate-config/.lake
                  key:
                      literate-config-${{ runner.os }}-${{
                      hashFiles('test-projects/literate-config/lean-toolchain') }}-${{
                      hashFiles('test-projects/literate-config/lake-manifest.json') }}-${{
                      steps.shortSHA.outputs.short_sha }}
                  restore-keys: |
                      literate-config-${{ runner.os }}-${{ hashFiles('test-projects/literate-config/lean-toolchain') }}-${{ hashFiles('test-projects/literate-config/lake-manifest.json') }}-
              background: true

            - name: Cache literate-multi-root test project
              id: literate-multi-root-cache
              uses: actions/cache@v6.1.0
              with:
                  path: test-projects/literate-multi-root/.lake
                  key:
                      literate-multi-root-${{ runner.os }}-${{
                      hashFiles('test-projects/literate-multi-root/lean-toolchain') }}-${{
                      hashFiles('test-projects/literate-multi-root/lake-manifest.json') }}-${{
                      steps.shortSHA.outputs.short_sha }}
                  restore-keys: |
                      literate-multi-root-${{ runner.os }}-${{ hashFiles('test-projects/literate-multi-root/lean-toolchain') }}-${{ hashFiles('test-projects/literate-multi-root/lake-manifest.json') }}-
              background: true

            # Directories whose names start with a dot are skipped at every depth. The caches
            # that are being restored put the `lean-toolchain` files of dependencies there.
            - name: Install subproject toolchains
              run: |
                  find . -name lean-toolchain -type f -not -path '*/.*' | while read -r f; do
                      elan toolchain install "$(cat "$f")"
                  done

            - name: lean version
              run: |
                  lean --version

            # The caches are in place before Lake runs. The Playwright and npm installs below
            # use uv and Node, and the Playwright install runs `apt-get`, which the Inkscape
            # install has finished using.
            - name: Wait for the caches and the first installs
              wait:
                  [
                      lake-cache,
                      literate-config-cache,
                      literate-multi-root-cache,
                      inkscape,
                      uv,
                      playwright-cache,
                      node,
                  ]

            - name: Install Playwright browsers
              id: playwright
              run: |
                  uv run --project browser-tests --extra test playwright install chromium firefox --with-deps
              background: true

            - name: Install npm packages
              id: npm
              run: npm ci
              background: true

            # This was failing CI from clang crashing, so do it first for fast turnaround
            - name: Build the website examples subproject
              run: |
                  pushd test-projects/website-examples
                  lake build
                  popd

            - name: Check for orphaned modules
              run: |
                  # These are all the library modules plus the Errata self-tests, whose modules
                  # must stay reachable from their root for the test driver to run them; docs and
                  # the remaining test libraries are excluded
                  out="$(lake query VersoUtil:orphanMods Verso:orphanMods MultiVerso:orphanMods \
                    VersoSearch:orphanMods VersoBlog:orphanMods VersoManual:orphanMods \
                    VersoIlluminate:orphanMods VersoTutorial:orphanMods VersoLiterate:orphanMods \
                    VersoLiterateCode:orphanMods Errata:orphanMods ErrataTests:orphanMods)"
                  if [ -n "$(printf '%s' "$out" | tr -d '[:space:]')" ]; then
                    echo "Found orphaned modules:"
                    echo "$out"
                    exit 1
                  fi
                  echo "No orphaned modules."

            - name: Build the project
              run: |
                  lake build

            # Running linters catches forward reference errors in docstrings. Tests are excluded due
            # to some spurious linter warnings.
            #
            # Libraries are linted one at a time to reduce memory issues on CI runners.
            - name: Lint the libraries
              run: |
                  failed=0
                  for root in VersoUtil Verso MultiVerso VersoSearch VersoBlog VersoManual \
                      VersoIlluminate VersoTutorial VersoServe VersoLiterate VersoLiterateCode \
                      UsersGuide Errata; do
                      echo "::group::lake lint $root"
                      lake lint --builtin-lint --builtin-only "$root" || failed=1
                      echo "::endgroup::"
                  done
                  exit "$failed"

            # RELEASE_NOTES_BASE is what keeps this working against the shallow checkout above:
            # HEAD^1 is the base branch for both pull_request and merge_group runs, and is one
            # of the two commits that are fetched.
            #
            # A `No-Changelog:` line waives the rules about an entry's version and pull
            # requests, and gives the reason. A pull request is squashed into a commit whose
            # message is its description, so the description is read here and the commit
            # messages on merge_group and push runs.
            #
            # A bump branch reports the next version of Verso, while the entries that `main`
            # merges into it describe the version that `main` is preparing, so pushes to bump
            # branches are not checked.
            - name: Check the release notes
              if: >-
                  !(github.event_name == 'push'
                    && startsWith(github.ref_name, 'bump/v4.'))
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  REPO: ${{ github.repository }}
                  RELEASE_NOTES_BASE: HEAD^1
                  RELEASE_NOTES_PR: ${{ github.event.pull_request.number }}
              run: |
                  # The description is read through the API so that re-running this job after
                  # editing it sees the current text; the event payload holds whatever it said
                  # when the run was triggered.
                  if [ -n "$RELEASE_NOTES_PR" ]; then
                    RELEASE_NOTES_DESCRIPTION="$(gh api "repos/$REPO/pulls/$RELEASE_NOTES_PR" \
                      --jq '.body')"
                    export RELEASE_NOTES_DESCRIPTION
                  fi
                  lake lean scripts/release_notes.lean

            - name: Wait for the remaining installs
              wait: [texlive, playwright, npm, linkchecker]

            # The LaTeX `svg` package shells out to `inkscape --version` during
            # the `--check-tex` build. Fail here with a clear message if Inkscape
            # is missing or its version can't be read, rather than deep inside a
            # lualatex run.
            - name: Check Inkscape is available
              run: |
                  inkscape --version

            - name: Test the dev server
              run: |
                  ./src/tests/run_serve_test.sh

            # The steps from here to the parallel group generate every site that the group
            # reads. They run one at a time, so that one Lake process at a time builds in a
            # workspace.
            - name: Generate the test website
              run: |
                  lake run versoMain test-projects/website/DemoSiteMain.lean --output _out/test-projects/demosite

            - name: Generate the test genre's document
              run: |
                  lake run versoMain test-projects/custom-genre/SimplePageMain.lean

            - name: Generate some source HTML
              run: |
                  lake build Verso.Hover:literate
                  lake exe verso-html .lake/build/literate htmlout

            - name: Generate the test tutorial site
              run: |
                  lake run versoMain test-projects/tutorial-test/TutorialExampleMain.lean

            - name: Generate the manual
              run: |
                  ./generate.sh
                  cp _out/tex/main.pdf ./manual.pdf
                  cp -r _out/html-multi html-multi
                  cp README-html.md html-multi/README.md
                  zip -r html-manual.zip html-multi

            - name: Generate the demo site and make sure page_link works
              run: |
                  lake run versoMain test-projects/website/DemoSiteMain.lean --output _out/demosite
                  # Fail if the generated about page doesn't have the expected base tag and blog link
                  grep -qF '<a href="blog/">blog</a> genre' _out/demosite/about/index.html
                  grep -qF '<base href=".././"/>' _out/demosite/about/index.html

            # The sites are copied to `_out/literate-sites`, which is where the browser tests
            # read them.
            - name: Build the literate sites for browser tests
              run: src/tests/run_literate_browser_tests.sh build

            - name: Build the VersoHtml site for browser tests
              run: |
                  # The verso-html genre renders literate JSON into a standalone HTML site.
                  # We reuse the literate-config test project (already cached) as input, then
                  # run verso-html against its literate-JSON output.
                  pushd test-projects/literate-config
                  lake build +LitConfig:literate
                  popd
                  lake exe verso-html test-projects/literate-config/.lake/build/literate _out/verso-html

            - name: Build the package-manual site for browser tests
              run: |
                  lake run versoMain test-projects/package-manual/PackageManualMain.lean --output _out/package-manual

            # The steps in this group run at the same time, and the job continues once all of
            # them have finished. A step that fails leaves the others running, and fails the
            # job when the group ends.
            #
            # The browser suites and the link checks read sites in `_out`, which the steps
            # above have completed and which the group leaves unchanged. `lake test` builds in
            # the root workspace and in the literate test projects, and the widget tests build
            # in `test-projects/errata-widget`.
            - parallel:
                  - name: Run tests
                    run: |
                        lake test -- --test-options --verbose --wfail --junit=errata-report.xml --markdown=errata-summary.md -- --check-tex

                  # These tests show the widget in the real InfoView, which `npm ci` installs.
                  # pytest runs them only when `-m errata_widget` selects them.
                  - name: Run the run-test widget's browser tests
                    run: |
                        uv run --project browser-tests --extra test pytest browser-tests/errata-widget -m errata_widget -v

                  - name: Run literate browser tests
                    run: src/tests/run_literate_browser_tests.sh test literate-config

                  - name: Run multi-root literate browser tests
                    run: src/tests/run_literate_browser_tests.sh test literate-multi-root

                  - name: Run browser tests
                    run: |
                        uv run --project browser-tests --extra test pytest \
                          browser-tests/test_search.py \
                          browser-tests/test_search_priority.py \
                          browser-tests/test_search_page.py \
                          browser-tests/test_search_highlight.py \
                          browser-tests/test_search_path_prefix.py \
                          browser-tests/test_toc_resize.py \
                          browser-tests/test_redirect.py \
                          browser-tests/test_katex.py -v

                  - name: Run VersoHtml browser tests
                    run: |
                        uv run --project browser-tests --extra test pytest \
                          browser-tests/verso-html -v \
                          --site-dir "$(pwd)/_out/verso-html"

                  - name: Run package-manual browser tests
                    run: |
                        uv run --project browser-tests --extra test pytest \
                          browser-tests/package-manual -v \
                          --site-dir "$(pwd)/_out/package-manual/html-multi"

                  - name: Check internal links on the test website
                    run: |
                        linkchecker --config=.linkchecker/linkcheckerrc --no-status ./_out/test-projects/demosite/

                  - name: Check internal links on the test tutorial site
                    run: |
                        linkchecker --config=.linkchecker/linkcheckerrc --no-status ./_out/tut/

                  - name: Type check the search bar code
                    run: |
                        pushd _out/html-multi/-verso-search
                        npx tsc --noEmit -p jsconfig.json
                        popd

                  - name: Type check the page scripts
                    run: |
                        pushd static-web
                        npx tsc --noEmit -p jsconfig.json
                        popd

                  - name: Lint the page scripts
                    run: npm run lint

                  # The widget is checked against the React and InfoView declarations that
                  # `npm ci` installs, which are the versions the InfoView runs it with.
                  - name: Type check the run-test widget JS code
                    run: npm run typecheck:widget

                  - name: Check the ToC width storage key stays in sync
                    run: |
                        # toc-resize.js and toc-resize-preload.js must agree on the localStorage
                        # key, since the preload primes the value the main script later reads.
                        main_key=$(grep -oE 'STORAGE_KEY = "[^"]+"' static-web/toc-resize.js | grep -oE '"[^"]+"')
                        preload_key=$(grep -oE 'getItem\("[^"]+"\)' static-web/toc-resize-preload.js | grep -oE '"[^"]+"')
                        echo "toc-resize.js storage key:         ${main_key:-<none>}"
                        echo "toc-resize-preload.js storage key: ${preload_key:-<none>}"
                        if [ -z "$main_key" ] || [ -z "$preload_key" ]; then
                            echo "::error::Could not find the ToC width storage key in one of the scripts" >&2
                            exit 1
                        fi
                        if [ "$main_key" != "$preload_key" ]; then
                            echo "::error::ToC width localStorage key differs between toc-resize.js and toc-resize-preload.js" >&2
                            exit 1
                        fi

            - name: Add test results to the job summary
              if: always()
              run: |
                  if [ -f errata-summary.md ]; then cat errata-summary.md >> "$GITHUB_STEP_SUMMARY"; fi

            # Publishing a check run needs a token with `checks: write`, which pull requests from
            # forks never receive; those runs get their results from the job summary and the
            # uploaded artifact instead. The report exists once the tests have run, whether they
            # passed or failed, and a build that fails first leaves it unwritten.
            - name: Publish the JUnit test report
              if:
                  always() && hashFiles('errata-report.xml') != '' && (github.event_name !=
                  'pull_request' || github.event.pull_request.head.repo.full_name ==
                  github.repository)
              uses: dorny/test-reporter@v3.2.0
              with:
                  name: Errata tests
                  path: errata-report.xml
                  reporter: java-junit
                  fail-on-error: false

            - name: Upload the raw test reports
              if: always()
              uses: actions/upload-artifact@v7.0.2
              with:
                  name: errata-test-reports
                  path: |
                      errata-report.xml
                      errata-summary.md
                  if-no-files-found: ignore

            - name: Upload docs to artifact storage
              if: github.ref != 'refs/heads/main'
              uses: actions/upload-artifact@v7.0.2
              with:
                  name: "Verso manual (PDF and HTML)"
                  path: |
                      manual.pdf
                      html-manual.zip

            - uses: "marvinpinto/action-automatic-releases@v1.2.1"
              if: github.ref == 'refs/heads/main'
              with:
                  repo_token: "${{ secrets.GITHUB_TOKEN }}"
                  automatic_release_tag: "latest"
                  title: "Verso manual (PDF and HTML)"
                  files: |
                      manual.pdf
                      html-manual.zip

              # deploy-info computes metadata that's shown in the Netlify interface
              # about the deployment (for non-PR deploys)
            - id: deploy-info
              name: Compute Deployment Metadata
              if: github.event_name != 'pull_request'
              run: |
                  set -e
                  echo "message=$(git log -1 --pretty=format:"%s")" >> "$GITHUB_OUTPUT"

            - name: Upload HTML manual for PR deployment
              if: github.event_name == 'pull_request'
              uses: actions/upload-artifact@v7.0.2
              with:
                  name: html-manual-for-deploy
                  path: _out/html-multi
                  retention-days: 1

            - name: Deploy Verso manual
              id: deploy-lang
              uses: nwtgck/actions-netlify@v4.0.0
              if: github.event_name == 'push' && github.ref_name == 'main'
              with:
                  publish-dir: _out/html-multi
                  production-branch: main
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  alias: ref-${{ github.ref_name }}
                  deploy-message:
                      "ref/${{ github.ref_name }}: ${{ steps.deploy-info.outputs.message }}"
                  enable-commit-comment: false
                  github-deployment-environment: verso-main
                  fails-without-credentials: true
              env:
                  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
                  NETLIFY_SITE_ID: "8a89abd8-095b-4496-a9c1-381d2d5629ec" # TODO: if a tag, push to a different site for hosting under lean-lang.org
