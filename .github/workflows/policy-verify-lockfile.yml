name: Verify the workflow lockfile

on:
    pull_request:
    merge_group:

permissions:
    contents: read

jobs:
    verify-lockfile:
        runs-on: ubuntu-latest
        env:
            GH_TOKEN: ${{ github.token }}
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false

            - name: Install the lockfile extension
              run: gh extension install github/gh-actions-lock --pin v0.4.1

            - name: Verify .github/workflows/actions.lock
              run: gh actions-lock --verify
