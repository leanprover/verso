name: No tracked ignored files

on: [pull_request, merge_group]

jobs:
    check-tracked-ignored:
        name: "Check no tracked file matches .gitignore"
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Check for tracked files that match .gitignore
              run: |
                  # Generated files are ignored so that they stay out of the
                  # repository. Tracking them can lead to merge conflicts.
                  tracked=$(git ls-files -ci --exclude-standard)
                  if [ -n "$tracked" ]; then
                    echo "These tracked files match .gitignore and should be removed with 'git rm --cached':"
                    echo "$tracked"
                    exit 1
                  fi
                  echo "No tracked files match .gitignore."
