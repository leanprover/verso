name: Prettier on PR Comment

on:
    issue_comment:
        types: [created]

jobs:
    prettier:
        # Only run on PR comments containing "!prettier"
        if: >-
            github.event.issue.pull_request && contains(github.event.comment.body, '!prettier')
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Check user permission
              uses: actions/github-script@v9.0.0
              with:
                  script: |
                      const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        username: context.payload.comment.user.login
                      });
                      const level = permission.permission;
                      if (level !== 'admin' && level !== 'write') {
                        core.setFailed(
                          `User ${context.payload.comment.user.login} does not have write access (permission: ${level})`
                        );
                      }

            - name: Get PR details
              id: pr-details
              uses: actions/github-script@v9.0.0
              with:
                  script: |
                      const { data: pr } = await github.rest.pulls.get({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        pull_number: context.payload.issue.number
                      });
                      core.setOutput('base_ref', pr.base.ref);
                      const isFork = pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`;
                      if (isFork && !pr.maintainer_can_modify) {
                        core.setFailed(
                          'Cannot push to this fork PR. The PR author must enable "Allow edits by maintainers".'
                        );
                      }

            - name: Add reaction to acknowledge
              uses: actions/github-script@v9.0.0
              with:
                  script: |
                      await github.rest.reactions.createForIssueComment({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        comment_id: context.payload.comment.id,
                        content: 'eyes'
                      });

            - name: Checkout repository
              uses: actions/checkout@v7.0.1
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            - uses: actions/setup-node@v7.1.0
              with:
                  node-version: "lts/*"

            # This job has a write token, so the code that it runs comes from the branch that the
            # pull request targets. Prettier and its configuration are set aside here, before the pull
            # request is checked out, and the pull request's own package.json is not installed.
            - name: Install the Prettier that the target branch pins
              env:
                  BASE_REF: ${{ steps.pr-details.outputs.base_ref }}
              run: |
                  git fetch --depth 1 origin "refs/heads/$BASE_REF"
                  mkdir "$RUNNER_TEMP/prettier"
                  for file in package.json package-lock.json .prettierrc; do
                      git show "FETCH_HEAD:$file" > "$RUNNER_TEMP/prettier/$file"
                  done
                  cd "$RUNNER_TEMP/prettier"
                  npm ci --ignore-scripts

            - name: Checkout PR branch
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh pr checkout ${{ github.event.issue.number }}

            - name: Run Prettier
              run: |
                  "$RUNNER_TEMP/prettier/node_modules/.bin/prettier" \
                      --config "$RUNNER_TEMP/prettier/.prettierrc" --write .

            - name: Commit and push
              id: commit
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add -A
                  if git diff --cached --quiet; then
                    echo "No formatting changes needed"
                    echo "changes=false" >> "$GITHUB_OUTPUT"
                  else
                    git commit -m "Run the Prettier code formatter"
                    git push
                    echo "changes=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Add completion reaction
              uses: actions/github-script@v9.0.0
              with:
                  script: |
                      await github.rest.reactions.createForIssueComment({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        comment_id: context.payload.comment.id,
                        content: '${{ steps.commit.outputs.changes == 'true' && 'rocket' || '+1' }}'
                      });
