[project]
name = "your-site-tests"
version = "0.1.0"
requires-python = ">=3.10"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-playwright",
]

[tool.pytest.ini_options]
markers = [
    "errata_widget: tests of Errata's run-test widget, which need a built Verso and `npm ci`; select them with `-m errata_widget`",
]
addopts = "-m 'not errata_widget'"
